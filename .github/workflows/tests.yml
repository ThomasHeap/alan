name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install alan
        run: pip install -e .

      - name: Run tests
        working-directory: tests
        # -n auto runs test files in parallel across CPU cores via
        # pytest-xdist. torch's own internal BLAS threading multiplies with
        # that (N worker processes each ALSO spawning multiple BLAS
        # threads), oversubscribing the runner's cores and making the whole
        # run slower than serial, not faster -- OMP/MKL_NUM_THREADS=1 pins
        # each worker to a single thread so xdist's parallelism is the only
        # parallelism in play (measured ~3x wall-clock speedup locally: 454s
        # serial vs 127s parallel-with-pinned-threads, on the same machine
        # where naive `-n auto` alone was slower than serial at 394s).
        run: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 pytest -q -n auto
